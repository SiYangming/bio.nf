software: rsem
canonical: rsem
category: quantification
description: 'RSEM（RNA-Seq by Expectation-Maximization）从转录组比对结果（或 reads
  直算）估计基因与转录本表达量，输出 *.genes.results / *.isoforms.results，
  是 riboseq / RNA-seq 定量流程核心工具（rsem-prepare-reference 建参考索引，
  rsem-calculate-expression 做 EM 定量）。
  '
homepage: https://deweylab.github.io/RSEM/
license: GPL-3.0-or-later
software_versions:
- id: rsem_native
  rsem: '1.3.3'
  bowtie2: '2.5.0'
  build_route: official biocontainer（quay.io/biocontainers/rsem / depot.galaxyproject.org）
  source: https://anaconda.org/bioconda/rsem
  note: '官方镜像优先（bioconda→quay.io/biocontainers→depot.galaxyproject.org），本地不再自建容器；
    rsem=1.3.3 与 bioconda / nf-core / snakemake env 完全一致；宿主机直跑 main.py 时用
    conda/mamba 安装 rsem + bowtie2（--bowtie2 路线，与 riboseq 流程一致）。'
- id: rsem_snakemake_wrappers
  wrapper_tag: v3.13.0
  rsem: '1.3.3'
  bowtie: '1.3.1'
  source: 'bioconda rsem=1.3.3 + bowtie=1.3.1（bio/rsem/calculate-expression/environment.yaml；prepare-reference / generate-data-matrix 仅 pin rsem=1.3.3）'
  note: '官方 bio/rsem 提供 calculate-expression / prepare-reference /
    generate-data-matrix 三个 wrapper（子模块清单以在线目录为准；snakemake-wrappers
    家族 tag 已于 2026-08-31 至 v9.17.0，引用 wrapper: 句柄时按需选择 tag）。
    本模块 snakemake/rsem_{prepare_reference,calculate_expression}.smk 为 riboseq 流程拆分的本地规则
    （conda env 同 riboseq bioconda rsem=1.3.3），与官方 wrapper 二选一。'
- id: rsem_nextflow_nfcore
  rsem: '1.3.3'
  star: 2.7.10a
  source: bioconda::rsem=1.3.3 + star=2.7.10a（modules/nf-core/rsem/{calculateexpression,preparereference}/environment.yml）
  note: '参考信息：本模块未建 nextflow/ 目录，nf-core 官方子模块
    （calculateexpression / preparereference）记录于 README/software_versions，
    组装 Nextflow 流程时用 nf-core modules install 安装。注意 nf-core rsem
    默认用 STAR 比对，与 native/snakemake（bowtie2/bowtie 路线）不同。'
implementations:
- id: rsem_native
  path: native
  source_type: custom
  type: native
  version: 1.3.3-v1.0
  priority: high
  when_to_use: '非流程引擎场景（AI Agent Function Calling / 独立 CLI / Shell 调用）的首选目标。
    自动注入 --num-threads 与 TMPDIR；容器走官方镜像（quay.io/biocontainers/rsem，tag 见 README）。
    '
  container_ref:
    bioconda: https://anaconda.org/bioconda/rsem
    quay_biocontainers: quay.io/biocontainers/rsem
    install_hint: 推荐 mamba create -n <env> -c conda-forge -c bioconda rsem=1.3.3 bowtie2；容器可用 quay.io/biocontainers/rsem:1.3.3--pl5321h077b44d_12
      镜像（与 riboseq 流程一致）
- id: rsem_snakemake_wrappers
  path: snakemake
  source_type: official
  type: snakemake_local
  version: v3.13.0
  priority: medium
  when_to_use: 组装 Snakemake 流程、复用中央 wrapper 缓存时；本模块
    snakemake/rsem_prepare_reference.smk 与 rsem_calculate_expression.smk 提供 riboseq 拆分
    本地规则（rsem_prepare_reference / rsem_calculate_expression），官方 bio/rsem 信息见
    README 与 software_versions。
default_implementation: rsem_native
inputs:
  subcommand:
    type: string
    required: true
    description: rsem 子命令：prepare-reference|calculate-expression
  reference_genome:
    type: file
    required: false
    cli_arg: positional
    description: prepare-reference 的参考基因组 FASTA（可 .gz）
  reference_name:
    type: string
    required: false
    cli_arg: positional
    description: prepare-reference 输出索引 basename（生成 .seq/.grp/.ti/.transcripts.fa）
  gtf:
    type: file
    required: false
    cli_arg: --gtf
    description: GTF 基因注释（prepare-reference 转录本结构）
  index:
    type: string
    required: false
    cli_arg: --index
    description: calculate-expression 的 RSEM 参考前缀（=prepare-reference 的 reference_name）
  prefix:
    type: string
    required: false
    cli_arg: --prefix
    description: calculate-expression 输出前缀（生成 .genes/.isoforms.results）
  alignments:
    type: file
    required: false
    cli_arg: --alignments
    description: 已比对 BAM/CRAM 输入（riboseq 主用法：umi 去重后 BAM）
  reads1:
    type: file
    required: false
    cli_arg: --reads
    description: 单端 reads 或双端 mate1（FASTQ，可 .gz；直算模式）
  reads2:
    type: file
    required: false
    cli_arg: --reads2
    description: 双端 mate2（FASTQ，可 .gz；提供即自动 --paired-end）
  paired_end:
    type: boolean
    default: false
    cli_arg: --paired-end
    description: 输入为双端数据（BAM 模式显式声明）
  bowtie2:
    type: boolean
    default: false
    cli_arg: --bowtie2
    description: prepare/直算模式用 bowtie2（而非默认 bowtie）路线
  fragment_length_mean:
    type: integer
    default: 300
    cli_arg: --fragment-length-mean
    description: 片段长度均值（riboseq 默认 300）
  fragment_length_sd:
    type: integer
    default: 100
    cli_arg: --fragment-length-sd
    description: 片段长度标准差（riboseq 默认 100）
  strandedness:
    type: string
    default: none
    cli_arg: --strandedness
    description: 链特异性协议：forward|reverse|none（riboseq 流程为 forward）
  threads:
    type: integer
    default: 4
    cli_arg: --threads
    description: 线程数（自动注入）
  extra_args:
    type: string
    required: false
    description: 透传给 rsem-* 的额外参数（高级用法，慎用）
outputs:
  rsem_reference:
    type: file
    format: rsem-index
    description: prepare-reference 产物：<ref>.{seq,grp,ti,transcripts.fa,...} 参考索引族
  genes_results:
    type: file
    format: txt
    description: calculate-expression 产物：<prefix>.genes.results 基因定量
  isoforms_results:
    type: file
    format: txt
    description: calculate-expression 产物：<prefix>.isoforms.results 转录本定量
environment:
  container_official: quay.io/biocontainers/rsem（bioconda 官方镜像；tag 以 quay / depot.galaxyproject.org 为准，见 README「容器与 Conda 链接」）
  note: 官方镜像已覆盖，本地不再维护 Dockerfile/Apptainer.def；宿主机直跑 main.py 时用 conda/mamba 安装 rsem。
optimization:
  default_cpus: 4
  default_mem_mb: 8192
  env_vars:
    TMPDIR: '{tmpdir}'
  per_subcommand_threads:
    prepare-reference: 8
    calculate-expression: 8
    default: 4
execution:
  entrypoint: python main.py
  test_command: bash test/run_test.sh
  binary: rsem-calculate-expression
  snakemake_rules:
  - rsem_prepare_reference.smk
  - rsem_calculate_expression.smk
  snakemake_include_hint: |-
    # 在 Snakefile 中（规则已拆为单规则文件，可分别 include；共用 snakemake/rsem.yaml 环境）：
    include: "modules/rsem/snakemake/rsem_prepare_reference.smk"
    include: "modules/rsem/snakemake/rsem_calculate_expression.smk"
    # config 契约与独立运行示例见各 .smk 头部，例如：
    #   snakemake -s modules/rsem/snakemake/rsem_prepare_reference.smk \
    #       --config rsem_input_fasta=genome.fa rsem_gtf=genes.gtf rsem_index_prefix=rsem_idx \
    #       --cores 8 --use-conda
