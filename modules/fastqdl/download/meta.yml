name: fastqdl_download
description: Download FASTQ files from ENA or SRA repositories
keywords:
  - sra
  - ena
  - download
  - fastq
  - fastq-dl
tools:
  - fastq-dl:
      description: |
        A tool to download FASTQs associated with Study, Experiment, or Run accessions from ENA or SRA.
      homepage: https://github.com/rpetit3/fastq-dl
      documentation: https://github.com/rpetit3/fastq-dl
      licence: ["MIT"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - accession:
        type: string
        description: ENA/SRA accession to query (Study, Sample, Experiment, Run accession)
output:
  - fastq:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.fastq.gz":
          type: file
          description: Downloaded FASTQ files
          pattern: "*.fastq.gz"
  - run_info:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*-run-info.tsv":
          type: file
          description: Tab-delimited file containing metadata for each Run downloaded
          pattern: "*-run-info.tsv"
  - run_mergers:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*-run-mergers.tsv":
          type: file
          description: Tab-delimited file containing merge information
          pattern: "*-run-mergers.tsv"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"
authors:
  - "@SiYangming"
maintainers:
  - "@SiYangming"
