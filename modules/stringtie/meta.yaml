software: stringtie
canonical: stringtie
category: transcriptome
description: 'StringTie 是长读/短读 RNA-seq 的转录本组装与定量工具： stringtie <bam> 基于比对结果重构转录本（支持
  --conservative -L -R 长读模式）， stringtie --merge 合并多样本 GTF 得到非冗余转录本集， 是 nanoseq 流程的转录本组装与合并核心（含坐标修复
  fix_gtf 前处理）。

  '
homepage: https://ccb.jhu.edu/software/stringtie/
license: Artistic-2.0
software_versions:
- id: stringtie_native
  stringtie: 3.0.3
  build_route: official biocontainer（quay.io/biocontainers/stringtie / depot.galaxyproject.org）
  source: https://anaconda.org/bioconda/stringtie
  note: '官方镜像优先（bioconda→quay.io/biocontainers→depot.galaxyproject.org），本地不再自建容器；
    stringtie=3.0.3 与 nf-core 当前 pin 一致；宿主机直跑 main.py 时用 conda/mamba 安装 stringtie。'
- id: stringtie_nextflow_nfcore
  module_version: nf-core master（2026-09）
  stringtie: 3.0.3
  source: bioconda::stringtie=3.0.3（modules/nf-core/stringtie/{stringtie,merge}/environment.yml）
  note: nf-core 有 stringtie/stringtie 与 stringtie/merge 两个子模块，均 pin bioconda::stringtie=3.0.3。
- id: stringtie_snakemake_wrappers
  wrapper_tag: v3.13.0
  stringtie: 官方无 wrapper（bio/stringtie 404）
  source: —
  note: 2026-09 抓取 https://api.github.com/repos/snakemake/snakemake-wrappers/contents/bio/stringtie
    返回 404；Snakemake 场景请使用 stringtie_snakemake_local。
- id: stringtie_nextflow_local
  stringtie: 未固定（用户按 main.nf 中 conda/container 自行声明）
- id: stringtie_snakemake_local
  stringtie: 3.0.3
  source: 自维护 snakemake/stringtie_assemble.smk + stringtie_fix_gtf.smk + stringtie_merge.smk（td2 式单规则拆分）
  note: 'conda 环境为 snakemake/stringtie.yaml（bioconda::stringtie=3.0.3）；assemble/merge 走
    同目录 script wrapper（docker/native/conda 三模式分派），fix_gtf 走同目录 wrapper（awk helper fix_gtf.awk）。'
implementations:
- id: stringtie_native
  path: native
  source_type: custom
  type: native
  version: 3.0.3-v1.0
  priority: high
  when_to_use: '非流程引擎场景（AI Agent Function Calling / 独立 CLI / Shell 调用）的首选目标。 覆盖 assemble
    / merge / fix_gtf 三段链路，自动注入线程。

    '
  container_ref:
    bioconda: https://anaconda.org/bioconda/stringtie
    quay_biocontainers: quay.io/biocontainers/stringtie
    install_hint: 推荐 mamba create -n <env> -c conda-forge -c bioconda <sw>；容器可用 quay.io/biocontainers
      镜像
- id: stringtie_snakemake_wrappers
  path: snakemake
  source_type: official
  type: snakemake_local
  version: v3.13.0
  priority: medium
  when_to_use: 组装 Snakemake 流程、复用中央 wrapper 缓存时。
  note: 官方 snakemake-wrappers 暂无 bio/stringtie wrapper（2026-09 抓取 404），本实现仅登记桥接层，实际请走
    stringtie_snakemake_local。
default_implementation: stringtie_native
inputs:
  subcommand:
    type: string
    required: true
    description: stringtie 子命令：assemble|merge|fix_gtf
  bam:
    type: file
    required: false
    cli_arg: positional
    description: 输入 BAM（assemble；merge 为 GTF 列表文件）
  gtf:
    type: file
    required: false
    cli_arg: -G
    description: 参考注释 GTF（assemble/merge 使用）
  output:
    type: file
    required: false
    cli_arg: -o
    description: 输出 GTF 路径
  label:
    type: string
    required: false
    cli_arg: -l
    description: 转录本前缀标签（assemble 默认样本名 / merge 默认 MSTRG）
  min_transcript_len:
    type: integer
    default: 200
    cli_arg: -m
    description: 最小转录本长度
  long_reads:
    type: boolean
    default: true
    cli_arg: -L
    description: 长读模式（assemble）
  rf_stranded:
    type: boolean
    default: true
    cli_arg: -R
    description: RF 链特异性（assemble）
  conservative:
    type: boolean
    default: true
    cli_arg: --conservative
    description: 保守模式：避免合并可能属于不同位点的转录本（assemble）
  gtf_list:
    type: file
    required: false
    cli_arg: positional
    description: merge 输入的 GTF 列表文件（每行一个 GTF 路径）
  threads:
    type: integer
    default: 4
    cli_arg: -p
    description: 线程数（自动注入）
  extra_args:
    type: string
    required: false
    description: 透传给 stringtie 的额外参数（高级用法，慎用）
outputs:
  assembled_gtf:
    type: file
    format: gtf
    description: assemble 输出的样本级转录本 GTF
  merged_gtf:
    type: file
    format: gtf
    description: merge 输出的非冗余合并 GTF
  fixed_gtf:
    type: file
    format: gtf
    description: fix_gtf 输出的坐标修复 GTF（$4<=$5）
environment:
  container_official: quay.io/biocontainers/stringtie（bioconda 官方镜像；tag 以 quay / depot.galaxyproject.org 为准，见 README「容器与 Conda 链接」）
  note: 官方镜像已覆盖，本地不再维护 Dockerfile/Apptainer.def；宿主机直跑 main.py 时用 conda/mamba 安装 stringtie。
optimization:
  default_cpus: 4
  default_mem_mb: 8192
  tmpdir: /tmp
  env_vars:
    TMPDIR: '{tmpdir}'
    PYTHONUNBUFFERED: '1'
  per_subcommand_threads:
    assemble: 8
    merge: 4
    fix_gtf: 2
    default: 4
execution:
  entrypoint: python main.py
  test_command: bash test/run_test.sh
  binary: stringtie
  snakemake_include_hint: |-
    # 在 Snakefile 中（规则已拆为单规则文件，可分别 include；assemble/merge 共用 snakemake/stringtie.yaml 环境，
    # fix_gtf 为纯文本 awk 不挂 conda）：
    # 顶层键：exec_mode(conda|docker|native)；软件段（config.yaml 预设）：stringtie.{docker_image,stringtie_bin}
    include: "modules/stringtie/snakemake/stringtie_assemble.smk"
    include: "modules/stringtie/snakemake/stringtie_fix_gtf.smk"
    include: "modules/stringtie/snakemake/stringtie_merge.smk"
    # config 契约与独立运行示例见各 .smk 头部，例如：
    #   snakemake -s modules/stringtie/snakemake/stringtie_assemble.smk \
    #       --config stringtie_bam=sample.sorted.bam \
    #           stringtie_gtf_annotation=gencode.v49.annotation.gtf --cores 8 --use-conda
  snakemake_rules:
  - snakemake/stringtie_assemble.smk
  - snakemake/stringtie_fix_gtf.smk
  - snakemake/stringtie_merge.smk
