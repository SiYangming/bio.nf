software: lima
canonical: lima
category: isoseq
description: 'lima 是 PacBio 的条形码拆分与引物去除工具（The PacBio Barcode Demultiplexer and Primer
  Remover），输入 ccs/subreads 的 BAM/FASTA/FASTQ，配合引物 FASTA 输出 去接头/拆分后的 reads，是 Iso-Seq
  流程的第二步（ccs -> lima -> isoseq3 refine）。

  '
homepage: https://lima.how/
license: BSD-3-Clause-Clear
implementations:
- id: lima_native
  path: native
  source_type: custom
  type: native
  version: 2.9.0
  priority: high
  when_to_use: 非流程引擎场景（AI Agent Function Calling / 独立 CLI）首选。自动注入线程与输出格式推断。
  container_ref:
    bioconda: https://anaconda.org/bioconda/lima
    quay_biocontainers: quay.io/biocontainers/lima
    install_hint: 推荐 mamba create -n <env> -c conda-forge -c bioconda <sw>；容器可用 quay.io/biocontainers
      镜像
- id: lima_snakemake_local
  path: snakemake
  source_type: custom
  type: snakemake_local
  version: "2.9.0"
  priority: medium
  when_to_use: 组装 Snakemake 流程、复用中央 wrapper 缓存时。
  note: 官方 snakemake-wrappers 暂无 bio/lima wrapper（2026-08 抓取 404），本实现仅登记桥接层，实际请降级
    lima_snakemake_local。
default_implementation: lima_native
software_versions:
  native:
    lima: 2.9.0
    build_route: official biocontainer（quay.io/biocontainers/lima / depot.galaxyproject.org）
    source: https://anaconda.org/bioconda/lima
    note: 官方镜像优先（bioconda→quay.io/biocontainers→depot.galaxyproject.org），本地不再自建容器；
      版本 lima=2.9.0 与 nf-core 对齐。
  nextflow_nfcore:
    lima: 2.9.0
    module_version: 1.0.0
    source: bioconda::lima=2.9.0（modules/nf-core/lima/environment.yml）
    note: nf-core lima 为单模块（不分子命令）；container 用 community.wave.seqera.io 生成。
  nextflow_local:
    lima: （继承 native 容器或显式 pin；未启用则写占位）
  snakemake_wrappers:
    lima: 官方无 wrapper（bio/lima 404）
    wrapper_tag: v3.13.0
    source: —
    note: 2026-08 抓取 snakemake-wrappers bio/lima 返回 404，官方未收录；请使用 lima_snakemake_local。
  snakemake_local:
    lima: 2.9.0
    source: 自维护 lima.smk + lima.py + 同目录 snakemake/lima.yaml（bioconda::lima=2.9.0）
    note: 单规则 lima.smk（td2 式 config 驱动）；shell 已迁同目录 wrapper lima.py，经共享
      modules/docker_wrapper.py 支持 exec_mode conda/docker/native 三模式分派；conda 指向
      同目录 lima.yaml（lima=2.9.0）；二进制 lima（native 走 config lima.lima_bin）。
inputs:
  subcommand:
    type: string
    required: true
    description: lima 子命令：lima（唯一核心命令）
  reads:
    type: file
    required: true
    cli_arg: positional
    description: 输入 reads 文件（bam/fasta/fasta.gz/fastq/fastq.gz）
  primers:
    type: file
    required: true
    cli_arg: positional
    description: 引物 FASTA 文件（*.fasta）
  output:
    type: file
    required: false
    cli_arg: positional
    description: 输出文件路径（扩展名由输入格式推断；默认 <outdir>/<prefix>.<ext>）
  outdir:
    type: string
    required: false
    cli_arg: -d
    description: 输出目录（缺省为输入文件所在目录）
  prefix:
    type: string
    required: false
    description: 输出前缀（默认从 reads 文件名推断）
  threads:
    type: integer
    default: 4
    cli_arg: -j
    description: 线程数（自动注入）
  isoseq:
    type: boolean
    default: false
    cli_arg: --isoseq
    description: Iso-Seq 模式（末端识别优化，Iso-Seq 流程推荐）
  peek_guess:
    type: boolean
    default: false
    cli_arg: --peek-guess
    description: peek 模式猜测引物对
  min_score:
    type: float
    required: false
    cli_arg: --min-score
    description: 最小比对得分阈值
  extra_args:
    type: string
    required: false
    description: 透传给 lima 的额外参数（高级用法，慎用）
outputs:
  demux:
    type: file
    format:
    - bam
    - fasta
    - fastq
    description: 去引物/拆分后的 reads（格式与输入一致）
  pbi:
    type: file
    format: pbi
    description: BAM 输出时的 PacBio 索引
  counts:
    type: file
    format: txt
    description: 引物对计数表（*.counts）
  report:
    type: file
    format: txt
    description: 逐 ZMW 报告（*.report）
  summary:
    type: file
    format: txt
    description: 过滤汇总（*.summary）
  json:
    type: file
    format: json
    description: 元数据 json（*.json）
  xml:
    type: file
    format: xml
    description: DataSet xml（*.xml）
  clips:
    type: file
    format: fasta
    description: 剪切的引物序列（*.clips）
environment:
  container_official: quay.io/biocontainers/lima（bioconda 官方镜像；tag 以 quay / depot.galaxyproject.org 为准，见 README）
  note: 官方镜像已覆盖，本地不再维护 Dockerfile/Apptainer.def；宿主机直跑 main.py 时用 conda/mamba 安装 lima。
optimization:
  default_cpus: 4
  default_mem_mb: 8192
  tmpdir: /tmp
  env_vars:
    TMPDIR: '{tmpdir}'
    PYTHONUNBUFFERED: '1'
  per_subcommand_threads:
    lima: 8
    default: 4
execution:
  entrypoint: python main.py
  test_command: bash test/run_test.sh
  binary: lima
  snakemake_include_hint: |-
    # 在 Snakefile 中（规则为 config 驱动单规则文件，直接 include；conda 环境 = 同目录
    #   snakemake/lima.yaml；原聚合 lima.smk 的 envs/lima.yaml 幽灵引用已消除）：
    include: "modules/lima/snakemake/lima.smk"
    # config 契约与独立运行示例见 .smk 头部，例如：
    #   snakemake -s modules/lima/snakemake/lima.smk \
    #       --config lima_input_reads=sample.reads.bam lima_input_primers=primers.fasta \
    #       lima_output=demux/sample.demux.bam 'lima.extra_params=--isoseq --peek-guess' \
    #       --cores 8 --use-conda
    # exec_mode: conda(默认)|docker|native；docker 需 lima.docker_image，native 需 lima.lima_bin
    #   （wrapper lima.py 三模式分派，见 .smk 头注）
  snakemake_rules:
  - lima.smk
