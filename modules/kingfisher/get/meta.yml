name: kingfisher_get
description: Download and extract sequence data from SRA or ENA
keywords:
  - sra
  - ena
  - download
  - fastq
  - kingfisher
tools:
  - kingfisher:
      description: |
        Kingfisher is a fast and flexible program for procurement of sequence files (and
        their metadata annotations) from public data sources, including the European Nucleotide
        Archive (ENA), NCBI SRA, Amazon AWS and Google Cloud.
      homepage: https://wwood.github.io/kingfisher-download/
      documentation: https://wwood.github.io/kingfisher-download/
      doi: 10.1111/1755-0998.13664
      licence: ["GPL v3"]
      identifier: biotools:kingfisher
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - run_id:
        type: string
        description: Run ID (e.g. SRR9984183)
output:
  - fastq:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.fastq.gz":
          type: file
          description: Downloaded FASTQ files
          pattern: "*.fastq.gz"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"
