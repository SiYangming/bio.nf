software: samtools
canonical: samtools
category: alignment_utils
description: 'samtools 是操作 SAM/BAM/CRAM 的高通量测序数据工具集，提供排序、索引、 统计、提取、转换、拼接、pileup 等核心能力，是绝大多数
  NGS 流程的底座。

  '
homepage: http://www.htslib.org/
license: MIT
software_versions:
- id: samtools_native
  samtools: '1.21'
  build_route: official biocontainer（quay.io/biocontainers/samtools / depot.galaxyproject.org）
  source: https://anaconda.org/bioconda/samtools
  note: '官方镜像优先（bioconda→quay.io/biocontainers→depot.galaxyproject.org），本地不再自建容器；
    samtools=1.21（含 htslib=1.21）由官方镜像/conda 提供；宿主机直跑 main.py 时用 conda/mamba 安装。'
- id: samtools_nextflow_nfcore
  module_version: 2.2.0
  samtools: '1.24'
  source: bioconda::samtools=1.24（modules/nf-core/samtools/*/environment.yml）
  note: nf-core master 在 2026-07 起多数子模块已 bump 到 samtools=1.24；HPC/Cloud 使用 Wave 容器时请以对应子模块
    meta 为准。
- id: samtools_snakemake_wrappers
  wrapper_tag: v3.13.0
  samtools: '1.24'
  source: bioconda samtools=1.24 + snakemake-wrapper-utils=0.9.0（bio/samtools/*/environment.yaml）
  note: 与 nf-core 当前版本一致；若固定 wrapper tag < v3.13，samtools 可能回落 1.21–1.23。
- id: samtools_nextflow_local
  samtools: 未固定（用户按 main.nf 中 conda/container 自行声明）
- id: samtools_snakemake_local
  samtools: '1.23'
  source: snakemake/samtools.yaml（本地规则 conda env，bioconda::samtools==1.23）
  note: 本地规则 env 固定 samtools=1.23（与 official wrapper/nf-core 的 1.24 相差一个 minor）
implementations:
- id: samtools_native
  path: native
  source_type: custom
  type: native
  version: "1.21"
  priority: high
  when_to_use: '非流程引擎场景（AI Agent Function Calling / 独立 CLI / Shell 调用）的首选目标。

    '
  container_ref:
    bioconda: https://anaconda.org/bioconda/samtools
    quay_biocontainers: quay.io/biocontainers/samtools
    install_hint: 推荐 mamba create -n <env> -c conda-forge -c bioconda samtools=1.21；容器可用 quay.io/biocontainers/samtools:1.21--h96c455f_1
      镜像（tag 见 README）
- id: samtools_snakemake_local
  path: snakemake
  source_type: custom
  type: snakemake_local
  version: "1.23"
  priority: medium
  when_to_use: 组装 Snakemake 流程、复用中央 wrapper 缓存时。
default_implementation: samtools_native
inputs:
  subcommand:
    type: string
    required: true
    description: samtools 子命令：view|sort|index|flagstat|idxstats|stats|depth|mpileup|faidx|merge|quickcheck
  input:
    type: file
    required: true
    cli_arg: positional
    description: 输入文件（SAM/BAM/CRAM/FASTA）
  output:
    type: file
    required: false
    cli_arg: -o
    description: 输出文件路径
  bam:
    type: file
    required: false
    cli_arg: positional
    description: 主输入 BAM（index/flagstat/idxstats/stats/depth 等）
  bam_list:
    type: string
    required: false
    cli_arg: -b
    description: merge 时的 BAM 列表文件
  region:
    type: string
    required: false
    cli_arg: positional
    description: 区域字符串（如 chr1:1000-2000），view/stats/depth 等可用
  fasta:
    type: file
    required: false
    cli_arg: -f
    description: faidx 目标 FASTA / mpileup 参考序列
  threads:
    type: integer
    default: 4
    cli_arg: -@
    description: 线程数（自动注入）
  output_format:
    type: string
    required: false
    cli_arg: -O
    description: 输出格式：SAM/BAM/CRAM/JSON
  filter_flags:
    type: string
    required: false
    cli_arg: -F
    description: 过滤 FLAG（如 4=未比对，1796=常规质控）
  require_flags:
    type: string
    required: false
    cli_arg: -f
    description: 要求 FLAG
  min_mapq:
    type: integer
    required: false
    cli_arg: -q
    description: 最小 MAPQ
  sort_by_name:
    type: boolean
    default: false
    cli_arg: -n
    description: sort 时按 read name 排序
  index_format:
    type: string
    required: false
    cli_arg: -c
    description: index 时的索引格式（bai/csi）
  extra_args:
    type: string
    required: false
    description: 透传给 samtools 子命令的额外参数（高级用法，慎用）
outputs:
  result_file:
    type: file
    description: 主输出文件（BAM/索引/报告等，依子命令而定）
  stats_report:
    type: file
    format: txt
    description: stats 子命令产生的统计报告
environment:
  container_official: quay.io/biocontainers/samtools（bioconda 官方镜像；tag 以 quay / depot.galaxyproject.org 为准，见 README「容器与 Conda 链接」）
  note: 官方镜像已覆盖，本地不再维护 Dockerfile/Apptainer.def；宿主机直跑 main.py 时用 conda/mamba 安装 samtools。
optimization:
  default_cpus: 4
  default_mem_mb: 8192
  env_vars:
    TMPDIR: '{tmpdir}'
    HTS_LOG_TRACE: 'off'
  per_subcommand_threads:
    sort: 8
    view: 4
    mpileup: 4
    default: 4
execution:
  entrypoint: python main.py
  test_command: bash test/run_test.sh
  binary: samtools
  snakemake_rules:
  - samtools_sort.smk
  - samtools_index.smk
  - samtools_view.smk
  - samtools_sam_to_bam.smk
  - samtools_flagstat.smk
  - alignment_summary.smk
  snakemake_include_hint: |-
    # 在 Snakefile 中（规则已拆为单规则文件，可分别 include；需要工具的规则共用同目录 samtools.yaml 环境；
    # 原聚合 samtools.smk / samtools_riboseq.smk 已删除，按下列单规则文件 include）：
    include: "modules/samtools/snakemake/samtools_sort.smk"
    include: "modules/samtools/snakemake/samtools_index.smk"
    include: "modules/samtools/snakemake/samtools_view.smk"
    include: "modules/samtools/snakemake/samtools_sam_to_bam.smk"
    include: "modules/samtools/snakemake/samtools_flagstat.smk"
    include: "modules/samtools/snakemake/alignment_summary.smk"
    # 串联示例：令 samtools_index_input == samtools_sort_output 即自动建立 sort->index 依赖；
    # flagstat 批量汇总时在流程内赋值 config["alignment_summary_flagstats"] = [...flagstat.txt]。
    # config 契约与独立运行示例见各 .smk 头部，例如：
    #   snakemake -s modules/samtools/snakemake/samtools_sort.smk \
    #       --config samtools_sort_input=aln.sam samtools_sort_output=aln.sorted.bam --cores 8 --use-conda
